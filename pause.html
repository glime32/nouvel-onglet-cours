<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>En pause · séance de révision</title>
  <meta name="color-scheme" content="dark">
  <link rel="preload" href="fonts/archivo.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/gloock.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="icon" href="icone.png">
  <link rel="stylesheet" href="style.css">
  <script src="pause.js" defer></script>
</head>
<body>
  <main class="zoom pause swatch--violet" id="pause">
    <div class="zoom__inner">
      <svg class="ico zoom__icon" aria-hidden="true"><use href="#i-star"/></svg>
      <p class="zoom__kicker" id="p-bloc">Séance de révision</p>
      <h1 class="zoom__title" id="p-titre">Pas maintenant</h1>
      <p class="pause__info" id="p-info"></p>
      <ul class="pause__btns">
        <li><button type="button" class="swatch swatch--violet" id="p-retour">
          <span class="swatch__tile" aria-hidden="true"><svg class="ico"><use href="#i-star"/></svg></span>
          <span class="swatch__bar"><span class="swatch__kicker">Séance</span><span class="swatch__name">Retour à mes révisions</span><svg class="ico swatch__arrow" aria-hidden="true"><use href="#i-arrow"/></svg></span>
        </button></li>
      </ul>
    </div>
  </main>

  <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
    <symbol id="i-star" viewBox="0 0 24 24"><path fill="currentColor" d="M12 0c.75 6.6 5.4 11.25 12 12-6.6.75-11.25 5.4-12 12-.75-6.6-5.4-11.25-12-12C6.6 11.25 11.25 6.6 12 0z"/></symbol>
    <symbol id="i-arrow" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" d="M7 17 17 7M9 7h8v8"/></symbol>
  </svg>
</body>
</html>
