<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nouvel onglet</title>
  <meta name="color-scheme" content="dark">
  <link rel="preload" href="fonts/archivo.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/gloock.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%23000'/%3E%3Cpath fill='%23D980FF' d='M12 3c.6 5 3.4 7.8 8.4 8.4v.2c-5 .6-7.8 3.4-8.4 8.4h-.2c-.6-5-3.4-7.8-8.4-8.4v-.2C8.4 10.8 11.2 8 11.8 3z'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
  <script src="cours.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
  <h1 class="sr-only">Nouvel onglet</h1>

  <!-- Écran 1 : raccourcis -->
  <section class="screen screen--top" id="ecran-raccourcis" aria-labelledby="t-raccourcis">
    <header class="topbar">
      <span class="brand">
        <span class="brand__tile" aria-hidden="true"><svg class="ico"><use href="#i-star"/></svg></span>
        <span class="brand__name" id="brand-name"></span>
      </span>
      <p class="today" id="today"></p>
    </header>

    <div class="top__body wrap">
      <h2 class="section-title" id="t-raccourcis" tabindex="-1">Raccourcis</h2>
      <ul class="shortcuts" id="raccourcis"></ul>
      <ul class="shortcuts shortcuts--centre" id="revision" hidden></ul>
    </div>

    <a class="cue" href="#cours" data-go="cours">
      <span>Mes cours</span>
      <svg class="ico" aria-hidden="true"><use href="#i-down"/></svg>
    </a>
  </section>

  <!-- Écran 2 : la fac -->
  <section class="screen screen--cours" id="cours" aria-labelledby="titre" hidden>
    <a class="cue cue--up" href="#ecran-raccourcis" data-go="top">
      <svg class="ico" aria-hidden="true"><use href="#i-down"/></svg>
      <span>Raccourcis</span>
    </a>
    <div class="cours__body wrap">
      <div class="head">
        <div class="head__text">
          <h2 class="head__title" id="titre" tabindex="-1"></h2>
          <p class="head__lead" id="sous-titre"></p>
        </div>
        <ul class="head__btns" id="boutons"></ul>
      </div>

      <div class="ecrin">
        <span class="ecrin__ruler" aria-hidden="true"></span>
        <div class="ecrin__velvet" id="groupes"></div>
      </div>

      <section class="tiroir" aria-labelledby="t-infos">
        <h3 class="tiroir__title" id="t-infos">Infos &amp; admin</h3>
        <ul class="infos" id="infos"></ul>
      </section>
    </div>
  </section>

  <!-- Le volet du portfolio, joué entre les deux écrans -->
  <div class="wipe" id="wipe" aria-hidden="true">
    <span style="--h:13"></span><span style="--h:21"></span><span style="--h:8"></span><span style="--h:17"></span><span style="--h:11"></span><span style="--h:19"></span><span style="--h:11"></span>
  </div>

  <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
    <symbol id="i-star" viewBox="0 0 24 24"><path fill="currentColor" d="M12 0c.75 6.6 5.4 11.25 12 12-6.6.75-11.25 5.4-12 12-.75-6.6-5.4-11.25-12-12C6.6 11.25 11.25 6.6 12 0z"/></symbol>
    <symbol id="i-star8" viewBox="0 0 100 100"><polygon points="50,3 54.2,39.8 68.4,31.6 60.2,45.8 97,50 60.2,54.2 68.4,68.4 54.2,60.2 50,97 45.8,60.2 31.6,68.4 39.8,54.2 3,50 39.8,45.8 31.6,31.6 45.8,39.8" style="fill:var(--s8-fill,#C5F9FC);stroke:var(--s8-stroke,#1B2CC1);stroke-width:3.5;stroke-linejoin:round"/></symbol>
    <symbol id="i-down" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" d="M4.5 9 12 16.5 19.5 9"/></symbol>
    <symbol id="i-arrow" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" d="M7 17 17 7M9 7h8v8"/></symbol>

    <!-- Dessins techniques des cours (traits seuls, viewBox 120 x 64) -->
    <symbol id="d-algo" viewBox="0 0 120 64"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="44" y="3" width="32" height="12" rx="6"/><path d="M60 15v6M60 21l12 10-12 10-12-10zM48 31H30v13M72 31h18v13"/><rect x="18" y="44" width="24" height="14" rx="2"/><rect x="78" y="44" width="24" height="14" rx="2"/><path d="M26 40l4 4 4-4M86 40l4 4 4-4" opacity=".7"/></g></symbol>
    <symbol id="d-lambda" viewBox="0 0 120 64"><g fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M32 8q-11 24 0 48M88 8q11 24 0 48"/><path d="M46 9q8-3 12 7l16 38M61 25 46 54"/><path d="M76 54h6" opacity=".7"/></g></symbol>
    <symbol id="d-terminal" viewBox="0 0 120 64"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="20" y="6" width="80" height="52" rx="7"/><path d="M20 18h80"/><path d="M34 29l9 7-9 7M50 44h16"/></g><g fill="currentColor"><circle cx="28" cy="12" r="1.8"/><circle cx="34" cy="12" r="1.8"/><circle cx="40" cy="12" r="1.8"/></g></symbol>
    <symbol id="d-automate" viewBox="0 0 120 64"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="34" cy="38" r="11"/><circle cx="88" cy="38" r="11"/><circle cx="88" cy="38" r="7"/><path d="M5 38h17M17 34l5 4-5 4"/><path d="M44 32q22-18 34 0M71 28l7 4-1 -8"/><path d="M78 45q-22 14-34 0" stroke-dasharray="3 4"/><path d="M28 28q6-22 12 0"/></g></symbol>
    <symbol id="d-ensembles" viewBox="0 0 120 64"><g fill="none" stroke="currentColor" stroke-width="2"><circle cx="48" cy="32" r="22"/><circle cx="72" cy="32" r="22"/><path d="M60 13.7a22 22 0 0 1 0 36.6a22 22 0 0 1 0-36.6z" stroke-dasharray="2 3"/></g><g fill="currentColor"><circle cx="38" cy="28" r="2"/><circle cx="44" cy="40" r="2"/><circle cx="60" cy="32" r="2.4"/><circle cx="80" cy="25" r="2"/><circle cx="78" cy="41" r="2"/></g></symbol>
    <symbol id="d-matrice" viewBox="0 0 120 64"><g fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M38 6h-7v52h7M82 6h7v52h-7"/><path d="M44 16l32 32" stroke-dasharray="2 5" opacity=".7"/></g><g fill="currentColor"><circle cx="44" cy="16" r="3"/><circle cx="60" cy="16" r="2"/><circle cx="76" cy="16" r="2"/><circle cx="44" cy="32" r="2"/><circle cx="60" cy="32" r="3"/><circle cx="76" cy="32" r="2"/><circle cx="44" cy="48" r="2"/><circle cx="60" cy="48" r="2"/><circle cx="76" cy="48" r="3"/></g></symbol>
    <symbol id="d-courbe" viewBox="0 0 120 64"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 54h92M101 50l5 4-5 4M22 61V5M18 10l4-5 4 5"/><path d="M24 50c14 0 18-34 34-30s20 30 46-12"/><path d="M40 33 76 15" stroke-dasharray="3 4" opacity=".7"/></g><circle cx="58" cy="24" r="3" fill="currentColor"/></symbol>
    <symbol id="d-triangle" viewBox="0 0 120 64"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M60 6l34 50H26z"/><path d="M60 6v50" stroke-dasharray="3 4"/><path d="M60 50h6v6"/><path d="M37 56a11 11 0 0 0-4.3-9.6"/><path d="M40 33l3 3M80 33l-3 3" opacity=".8"/></g></symbol>
    <symbol id="d-integrale" viewBox="0 0 120 64"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 54h96M18 60V6"/><path d="M20 44c22-30 52-32 82-12"/><path d="M40 54V25.4M80 54V21.3"/><path d="M48 54V21.7M56 54V19.6M64 54V18.9M72 54V19.5" stroke-width="1.4" opacity=".7"/></g></symbol>
    <symbol id="d-etoile" viewBox="0 0 120 64"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" d="M60 4c1.6 14 10.4 22.4 24 24-13.6 1.6-22.4 10.4-24 24-1.6-13.6-10.4-22.4-24-24 13.6-1.6 22.4-10 24-24z"/></symbol>
  </svg>

</body>
</html>
