<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tri YouTube</title>
  <meta name="color-scheme" content="dark">
  <link rel="preload" href="fonts/archivo.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/gloock.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="icon" href="icone.png">
  <link rel="stylesheet" href="style.css">
  <script src="youtube.js" defer></script>
</head>
<body class="menu">
  <main class="menu__corps" id="corps">
    <h1 class="zoom__kicker swatch--violet">Tri YouTube</h1>

    <ul id="trier-liste">
      <li><button type="button" class="swatch swatch--violet" id="trier">
        <span class="swatch__tile" aria-hidden="true"><svg class="ico"><use href="#i-star"/></svg></span>
        <span class="swatch__bar"><span class="swatch__kicker" id="trier-etat">Tous les onglets</span><span class="swatch__name">Trier maintenant</span><svg class="ico swatch__arrow" aria-hidden="true"><use href="#i-arrow"/></svg></span>
      </button></li>
    </ul>

    <section class="swatch--violet" aria-labelledby="t-yt">
      <div class="group__head">
        <span class="group__tile" aria-hidden="true"><svg class="ico"><use href="#i-star"/></svg></span>
        <h2 class="group__name" id="t-yt">Dans YouTube</h2>
        <span class="group__count" id="n-yt">0</span>
      </div>
      <ul class="chaines" id="l-yt"></ul>
    </section>

    <section class="swatch--bleu" aria-labelledby="t-garder">
      <div class="group__head">
        <span class="group__tile" aria-hidden="true"><svg class="ico"><use href="#i-star"/></svg></span>
        <h2 class="group__name" id="t-garder">Garder</h2>
        <span class="group__count" id="n-garder">0</span>
      </div>
      <ul class="chaines" id="l-garder"></ul>
    </section>

    <section class="cle swatch--violet" id="cle" aria-labelledby="t-cle">
      <h2 class="tiroir__title" id="t-cle">Clé API YouTube</h2>
      <form class="cle__ligne" id="cle-form">
        <input class="cle__champ" id="cle-champ" type="text" autocomplete="off" spellcheck="false" aria-labelledby="t-cle" placeholder="AIza…">
        <button class="cle__ok swatch__kicker" type="submit">Enregistrer</button>
      </form>
      <p class="pause__info cle__etat" id="cle-etat" aria-live="polite"></p>
    </section>
  </main>

  <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
    <symbol id="i-star" viewBox="0 0 24 24"><path fill="currentColor" d="M12 0c.75 6.6 5.4 11.25 12 12-6.6.75-11.25 5.4-12 12-.75-6.6-5.4-11.25-12-12C6.6 11.25 11.25 6.6 12 0z"/></symbol>
    <symbol id="i-arrow" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" d="M7 17 17 7M9 7h8v8"/></symbol>
  </svg>
</body>
</html>
